name: Build Paisa Pilot Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias paisapilot \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass paisapilot2026 \
            -keypass paisapilot2026 \
            -dname "CN=Paisa Pilot, OU=Mobile, O=PaisaPilot, L=Hyderabad, ST=Telangana, C=IN"

      - name: Build Release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: PaisaPilot-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
